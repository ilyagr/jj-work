[package]
name = "jj-work"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.5.62", features = ["unstable-dynamic"] }
config = { version = "0.15.19", default-features = false, features = ["toml", "json", "convert-case"] }
serde = { version = "1.0.228", features = ["serde_derive"] }
thiserror = "2.0.17"
toml = "0.9.10"
xshell = "0.2.7"
